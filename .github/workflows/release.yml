name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semver bump type
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Bump, Tag & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install latest npm CLI (for OIDC Trusted Publishing)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build client
        run: pnpm build

      - name: Run unit tests
        run: pnpm test

      - name: Run smoke checks
        run: pnpm smoke

      - name: Bump version, update CHANGELOG.md, commit & tag
        id: version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TAG=$(npm version "${{ inputs.bump }}" --no-git-tag-version)
          node scripts/update-changelog.js
          git add package.json CHANGELOG.md
          git commit -m "chore(release): ${TAG}"
          git tag "${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          git push origin main --follow-tags

      - name: Stage publish to npm (OIDC)
        run: npm stage publish

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.version.outputs.tag }}" --generate-notes
